<div class="modal-overlay">
  <div class="modal-backdrop" (click)="onClose()" aria-hidden="true"></div>

  <div
    class="modal modal--wide"
    role="dialog"
    aria-modal="true"
    aria-labelledby="task-detail-title"
  >
    <div class="modal-header">
      <div class="modal-header-title">
        <span class="task-id-chip">#{{ task.id }}</span>
        <h2 id="task-detail-title">{{ task.title }}</h2>
      </div>
      <button class="modal-close" type="button" (click)="onClose()" aria-label="Close">
        &times;
      </button>
    </div>

    <div class="modal-body">
      <div class="modal-grid-3 detail-row">
        <div class="detail-item">
          <div class="detail-label">Status</div>
          <div class="detail-val">
            <span class="badge" [ngClass]="statusClass[task.status]">{{
              statusLabel[task.status]
            }}</span>
          </div>
        </div>

        <div class="detail-item">
          <div class="detail-label">Priority</div>
          <div class="detail-val">
            <span class="priority-tag" [ngClass]="priorityClass[task.priority]">{{
              priorityLabel[task.priority]
            }}</span>
          </div>
        </div>

        <div class="detail-item">
          <div class="detail-label">Project</div>
          <div class="detail-val">{{ projectName }}</div>
        </div>
      </div>

      <div class="modal-grid-2 detail-row">
        <div class="detail-item">
          <div class="detail-label">Reviewer</div>
          <div class="detail-val">{{ reviewerName }}</div>
        </div>

        <div class="detail-item">
          <div class="detail-label">Assignee</div>
          <div class="detail-val">{{ assigneeName }}</div>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Description</div>
        @if (task.description) {
        <p class="detail-description">{{ task.description }}</p>
        } @else {
        <p class="detail-description detail-description--empty">No description provided.</p>
        }
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" (click)="onClose()">Close</button>
    </div>
  </div>
</div>
