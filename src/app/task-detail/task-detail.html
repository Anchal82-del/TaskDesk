<div class="modal-overlay">
  <button
    type="button"
    class="modal-backdrop"
    tabindex="-1"
    aria-label="Close dialog"
    (click)="onClose()"
  ></button>

  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-detail-title">
    <div class="modal-header">
      <h2 id="task-detail-title">Task details</h2>
      <button class="modal-close" type="button" (click)="onClose()" aria-label="Close">
        &times;
      </button>
    </div>

    <div class="detail-block">
      <div class="detail-label">Title</div>
      <div class="detail-title">{{ task.title }}</div>
    </div>

    <div class="detail-block">
      <div class="detail-label-row">
        <div class="detail-label">Description</div>
        @if (!isEditingDescription) {
        <button type="button" class="text-btn" (click)="startEdit()">Edit</button>
        }
      </div>

      @if (isEditingDescription) {
      <textarea
        class="input"
        rows="5"
        [(ngModel)]="draftDescription"
        placeholder="Add a description…"
      ></textarea>
      <div class="detail-edit-actions">
        <button type="button" class="btn btn-ghost" (click)="cancelEdit()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="saveDescription()">Save</button>
      </div>
      } @else { @if (task.description) {
      <p class="detail-description">{{ task.description }}</p>
      } @else {
      <p class="detail-description detail-description--empty">No description yet.</p>
      } }
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-primary" (click)="onClose()">Close</button>
    </div>
  </div>
</div>
