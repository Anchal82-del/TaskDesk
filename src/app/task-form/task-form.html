<div class="modal-overlay">
  <div class="modal-backdrop" (click)="onCancel()" aria-hidden="true"></div>

  <div
    class="modal modal--wide"
    role="dialog"
    aria-modal="true"
    aria-labelledby="task-form-title"
  >
    <div class="modal-header">
      <div class="modal-header-title">
        @if (task) {
        <span class="task-id-chip">#{{ task.id }}</span>
        }
        <h2 id="task-form-title">{{ heading }}</h2>
      </div>
      <button class="modal-close" type="button" (click)="onCancel()" aria-label="Close">
        &times;
      </button>
    </div>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="modal-body">
        <div class="field">
          <label for="title">Title<span class="required-mark">*</span></label>
          <input
            class="input"
            [class.input-error]="isInvalid('title')"
            type="text"
            id="title"
            formControlName="title"
            placeholder="e.g. Set up project repo"
          />
          @if (isInvalid('title')) {
          <div class="field-error">Title is required.</div>
          }
        </div>

        <div class="modal-grid-3">
          <div class="field">
            <label for="status">Status<span class="required-mark">*</span></label>
            <select
              class="input"
              [class.input-error]="isInvalid('status')"
              id="status"
              formControlName="status"
            >
              <option [ngValue]="null" disabled>Select status</option>
              @for (o of statusOptions; track o.value) {
              <option [ngValue]="o.value">{{ o.label }}</option>
              }
            </select>
            @if (isInvalid('status')) {
            <div class="field-error">Status is required.</div>
            }
          </div>

          <div class="field">
            <label for="priority">Priority<span class="required-mark">*</span></label>
            <select
              class="input"
              [class.input-error]="isInvalid('priority')"
              id="priority"
              formControlName="priority"
            >
              <option [ngValue]="null" disabled>Select priority</option>
              @for (o of priorityOptions; track o.value) {
              <option [ngValue]="o.value">{{ o.label }}</option>
              }
            </select>
            @if (isInvalid('priority')) {
            <div class="field-error">Priority is required.</div>
            }
          </div>

          <div class="field">
            <label for="projectId">Project<span class="required-mark">*</span></label>
            <select
              class="input"
              [class.input-error]="isInvalid('projectId')"
              id="projectId"
              formControlName="projectId"
            >
              <option [ngValue]="null" disabled>Select project</option>
              @for (p of projects; track p.id) {
              <option [ngValue]="p.id">{{ p.name }}</option>
              }
            </select>
            @if (isInvalid('projectId')) {
            <div class="field-error">Project is required.</div>
            }
          </div>
        </div>

        <div class="modal-grid-2">
          <app-user-search-select
            label="Reviewer"
            [required]="true"
            placeholder="Type name, email, or ID..."
            [users]="availableReviewers"
            [selectedUserId]="taskForm.controls.reviewerId.value"
            [hasError]="isInvalid('reviewerId') || hasReviewerAssigneeConflict"
            [errorMessage]="
              isInvalid('reviewerId')
                ? 'Reviewer is required.'
                : hasReviewerAssigneeConflict
                ? 'Reviewer cannot be the assignee.'
                : ''
            "
            idPrefix="reviewer"
            (userSelected)="onReviewerSelected($event)"
            (blurred)="taskForm.controls.reviewerId.markAsTouched()"
          ></app-user-search-select>

          <app-user-search-select
            label="Assignee"
            [required]="true"
            placeholder="Type name, email, or ID..."
            [users]="availableAssignees"
            [selectedUserId]="taskForm.controls.assigneeId.value"
            [hasError]="isInvalid('assigneeId') || hasReviewerAssigneeConflict"
            [errorMessage]="
              isInvalid('assigneeId')
                ? 'Assignee is required.'
                : hasReviewerAssigneeConflict
                ? 'Assignee cannot be the reviewer.'
                : ''
            "
            idPrefix="assignee"
            (userSelected)="onAssigneeSelected($event)"
            (blurred)="taskForm.controls.assigneeId.markAsTouched()"
          ></app-user-search-select>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea
            class="input"
            id="description"
            rows="3"
            formControlName="description"
            placeholder="Add a description…"
          ></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <p class="required-note">* Required field</p>
        <button type="button" class="btn btn-ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">
          {{ submitLabel }}
        </button>
      </div>
    </form>
  </div>
</div>
