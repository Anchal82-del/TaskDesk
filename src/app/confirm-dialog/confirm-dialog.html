<div class="modal-overlay">
  <div class="modal-backdrop" (click)="onCancel()" aria-hidden="true"></div>

  <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-header">
      <h2 id="confirm-title">{{ heading }}</h2>
      <button
        class="modal-close"
        type="button"
        (click)="onCancel()"
        [disabled]="isBusy"
        aria-label="Close"
      >
        &times;
      </button>
    </div>
    <p>{{ message }}</p>
    <div class="confirm-actions">
      <button type="button" class="btn btn-ghost" (click)="onCancel()" [disabled]="isBusy">
        {{ cancelLabel }}
      </button>
      <button
        type="button"
        class="btn"
        [class.btn-danger]="danger"
        [class.btn-primary]="!danger"
        (click)="onConfirm()"
        [disabled]="isBusy"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
