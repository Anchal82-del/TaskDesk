<div class="topbar">
  <div>
    <h1>Settings</h1>
    <div class="sub">Personalize how TaskDesk looks and behaves for you.</div>
  </div>
</div>

<div class="settings-section">
  <h2>Appearance</h2>
  <div class="setting-row">
    <div>
      <div class="setting-label">Theme</div>
      <div class="setting-desc">Switch between a light and dark interface.</div>
    </div>
    <div class="theme-toggle">
      <button type="button" [class.active]="theme() === 'light'" (click)="setTheme('light')">
        Light
      </button>
      <button type="button" [class.active]="theme() === 'dark'" (click)="setTheme('dark')">
        Dark
      </button>
    </div>
  </div>
</div>

<div class="settings-section">
  <h2>Notifications</h2>
  <div class="setting-row">
    <div>
      <div class="setting-label">In-app notifications</div>
      <div class="setting-desc">
        Show alerts in the bell icon when tasks are created, reassigned, moved or deleted.
      </div>
    </div>
    <label class="switch">
      <input
        #notifToggle
        type="checkbox"
        aria-label="In-app notifications"
        [checked]="notificationsEnabled()"
        (change)="onNotifToggle(notifToggle.checked)"
      />
      <span class="switch-track"></span>
    </label>
  </div>
</div>
